# ==================== 美股实时预警配置（模板）====================
# 复制成 config.yaml 再填入真实值。config.yaml 含敏感信息，不要提交到 git。

watchlist:
  - ticker: AAPL
    name_cn: 苹果
    cik: "0000320193"
    forms: ["8-K", "8-K/A"]
  - ticker: MRVL
    name_cn: 美满
    cik: "0001835632"
    forms: ["8-K", "8-K/A"]
  - ticker: MU
    name_cn: 美光
    cik: "0000723125"
    forms: ["8-K", "8-K/A"]
  - ticker: SNDK
    name_cn: 闪迪
    cik: "0002023554"
    forms: ["8-K", "8-K/A"]
  - ticker: TSM
    name_cn: 台积电
    cik: "0001046179"
    forms: ["6-K", "20-F"]

poll_interval: 12
fresh_days: 2
notify_on_start: true

# SEC 要求带 User-Agent（格式：名称 邮箱），否则 403
sec_user_agent: "yourname your-email@example.com"

grok:
  # 密钥不写这里，由 systemd 的 /etc/news-alert.env 注入 GROK_API_KEY 环境变量
  api_key: ""
  model: "grok-4.3"
  proxy: "socks5h://127.0.0.1:10808"   # 本地 Xray SOCKS5，仅 Grok 调用走代理

bark:
  url: "https://api.day.app/YOUR_BARK_KEY"
  group: "美股预警"
  sound: "healthnotification"   # bell/glass/chime/birdsong/calypso/horn/newsflash/telegraph/silence 等

heartbeat:
  uptimekuma_push_url: ""   # 可选：填 UptimeKuma 的 Push 监控 URL
